<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#eef1e6">
<title>草樹 百恵</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="誰のスマホだろう？">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 단일 라이트 룩. 아이폰 라이트 모드 문법 + 피스타치오 케이스, 캐모마일 배경화면 */
:root{
  color-scheme: light;
  --stage:#eef1e6;
  --bg:#f2f2f7;
  --cell:#ffffff;
  --cell2:#e9e9ee;
  --sep:#d8d8dd;
  --text:#1c1c1e;
  --sec:#8a8a8e;
  --ter:#c0c0c5;
  --tint:#4f7d1a;
  --me:#6f9a3a;
  --them:#e9e9eb;
  --green:#34c759;
  --red:#ff3b30;
  --pink:#ff8fb0;
  --olive:#666638;
  --case:#dfe8c3;
  --case-dot:#f8fbef;
  --case-edge:#c6d3a0;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Noto Sans KR",system-ui,sans-serif;
  --font-ko:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans JP",system-ui,sans-serif;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP","Noto Sans KR",system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--stage);background-image:radial-gradient(#dfe5d0 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--text);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;
  box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;-webkit-font-smoothing:antialiased}
body.ko{font-family:var(--font-ko)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
.foot{font-size:11.5px;color:#9a9f8c;text-align:center;flex:none}

/* 케이스 */
.case{position:relative;width:min(414px,100%);height:min(868px,calc(100% - 26px));min-height:584px;border-radius:60px;padding:12px;flex:none;
  background:var(--case);background-image:radial-gradient(var(--case-dot) 2px,transparent 2.4px);background-size:16px 16px;
  box-shadow:inset 0 0 0 1.5px var(--case-edge),0 24px 60px rgba(80,90,50,.22),0 4px 12px rgba(80,90,50,.12)}
.case::before,.case::after{content:"";position:absolute;top:-14px;width:46px;height:40px;border-radius:50% 50% 40% 40%;background:inherit;box-shadow:inset 0 0 0 1.5px var(--case-edge);z-index:-1}
.case::before{left:40px}.case::after{right:40px}
.charm{position:absolute;left:-34px;bottom:120px;width:40px;height:150px;pointer-events:none}
.phone{position:relative;width:100%;height:100%;border-radius:48px;background:var(--bg);overflow:hidden;isolation:isolate;box-shadow:0 0 0 2px #fff}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:50;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen[hidden]{display:none!important}
.status{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 40px;font-size:16px;font-weight:600;letter-spacing:-.01em;position:relative;z-index:40;font-variant-numeric:tabular-nums;color:var(--text)}
.status .r{display:flex;gap:6px;align-items:center}
.bat{width:26px;height:12.5px;border:1.2px solid currentColor;opacity:.9;border-radius:4px;padding:1.5px;position:relative;display:inline-block}
.bat i{display:block;height:100%;width:62%;background:currentColor;border-radius:1.5px}
.bat::after{content:"";position:absolute;right:-3.5px;top:3.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:#1c1c1e;z-index:45}
.homebar-hit{position:absolute;left:0;right:0;bottom:0;height:26px;z-index:46}
.dk{background:#000!important;color:#fff}
.dk .status{color:#fff}

/* 배경화면 */
.wall{background:
  radial-gradient(70% 45% at 90% 8%,#ffe7ef 0%,transparent 70%),
  radial-gradient(80% 50% at 0% 100%,#e2eccb 0%,transparent 70%),
  radial-gradient(60% 40% at 30% 45%,#fff7d9 0%,transparent 70%),
  linear-gradient(175deg,#fffdf7 0%,#f7f9ee 60%,#eef4e1 100%)}
.wall > .art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wall > :not(.art){position:relative;z-index:1}

/* 잠금 */
.lock-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 14px 54px;width:100%;color:#4a4a24}
.lock-date{font-size:19px;font-weight:600;margin-top:8px;font-family:var(--round)}
.lock-time{font-size:94px;font-weight:700;line-height:1;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums;font-family:var(--round);color:#5a5a2c;text-shadow:0 2px 0 #fff}
.lock-sub{margin-top:8px;font-family:var(--round);font-size:14px;background:rgba(255,255,255,.7);padding:4px 12px;border-radius:999px;color:#6b6b3a}
.notifs{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:8px}
.notif{width:100%;background:rgba(255,255,255,.72);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:38px 1fr auto;gap:1px 10px;align-items:center;text-align:left;color:#1c1c1e;box-shadow:0 2px 10px rgba(80,90,50,.08)}
.notif .aic{grid-row:span 2;width:38px;height:38px;border-radius:9px;overflow:hidden}
.notif .aic svg{width:100%;height:100%;display:block}
.notif b{font-size:15px;font-weight:600}
.notif small{color:#8a8a8e;font-size:13px}
.notif p{grid-column:2/4;margin:0;font-size:15px;line-height:1.3}
.notif.stack{box-shadow:0 2px 10px rgba(80,90,50,.08),0 7px 0 -3px rgba(255,255,255,.55),0 13px 0 -6px rgba(255,255,255,.4)}
.lock-row{display:flex;justify-content:space-between;width:100%;padding:18px 34px 0}
.lock-row span{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.6);backdrop-filter:blur(10px);display:grid;place-items:center;color:#4a4a24}
.lock-hint{font-size:13px;color:#7a7a55;margin-top:14px}

/* 암호 */
.pin-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:30px 20px 50px;background:rgba(255,255,255,.45);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);width:100%;color:#2b2b18}
.pin-title{font-size:20px;margin-top:22px}
.dots{display:flex;gap:22px;margin:20px 0 34px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.4px solid #4a4a24}
.dots i.on{background:#4a4a24}
.dots.shake{animation:shake .45s}
@keyframes shake{15%,55%{transform:translateX(-10px)}35%,75%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.key{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;text-align:center;box-shadow:0 1px 3px rgba(80,90,50,.12)}
.key b{font-size:34px;font-weight:400}
.key small{font-size:10px;letter-spacing:.18em;margin-top:2px;font-weight:600}
.key:active{background:rgba(200,215,170,.9)}
.pin-foot{display:flex;justify-content:space-between;width:100%;max-width:290px;margin-top:auto;font-size:16px}
.pin-hint{min-height:40px;margin-top:16px;font-size:14px;color:#5a5a35;text-align:center}

/* 홈 */
.home-body{flex:1;display:flex;flex-direction:column;padding:10px 18px 24px;min-height:0}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.wdg{border-radius:22px;padding:14px 15px;aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 2px 12px rgba(80,90,50,.1)}
.wdg.cd{background:linear-gradient(160deg,#fff 0%,#f4f8e8 100%);color:#4a4a24;font-family:var(--round)}
.wdg.cd small{font-size:12px;color:#8a8a5c;display:block}
.wdg.cd .n{font-size:46px;font-weight:700;line-height:1;color:#666638}
.wdg.cd .n span{font-size:16px;margin-left:2px}
.wdg.cal{background:#fff;color:#000}
.wdg.cal .dw{color:#ff3b30;font-size:12px;font-weight:700;letter-spacing:.02em}
.wdg.cal .dn{font-size:40px;font-weight:300;line-height:1}
.wdg.cal .ev{border-left:3px solid var(--pink);padding-left:6px;font-size:12px;line-height:1.3}
.wdg.cal .ev small{color:#8e8e93;display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;width:76px;text-align:center;color:#3a3a22}
.app .ic{width:62px;height:62px;border-radius:14px;overflow:hidden;display:block;box-shadow:0 1px 4px rgba(80,90,50,.18)}
.app .ic svg{width:100%;height:100%;display:block}
.app span.lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px;font-weight:500}
.app:active .ic{filter:brightness(.85)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:12px;font-weight:600;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.icw{position:relative}
.pager{display:flex;gap:7px;justify-content:center;margin:auto 0 12px;padding:6px 10px;background:rgba(255,255,255,.55);border-radius:12px;align-self:center}
.pager i{width:7px;height:7px;border-radius:50%;background:rgba(74,74,36,.25)}
.pager i.on{background:#4a4a24}
.dock{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;background:rgba(255,255,255,.5);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border-radius:32px;padding:14px 6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.dock .lb{display:none}
@media (max-height:760px){.widgets{display:none}}

/* 통화 */
.callv{flex:1;display:flex;flex-direction:column;align-items:center;padding:60px 24px 50px;background:linear-gradient(180deg,#3b3f2c,#141510);color:#fff}
.cst{color:rgba(255,255,255,.7);font-size:16px;text-align:center;min-height:22px}
.cnm{font-size:34px;font-weight:500;margin-top:8px;text-align:center}
.cnum{color:rgba(255,255,255,.6);font-size:15px;margin-top:4px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 28px;margin-top:auto;font-size:12px;text-align:center}
.cgrid span{display:flex;flex-direction:column;align-items:center;gap:7px}
.cgrid i{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14)}
.cend{width:74px;height:74px;border-radius:50%;background:#ff3b30;display:grid;place-items:center;margin-top:40px}

/* 앱 공통 */
.app-screen{background:var(--bg)}
#view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.nav{flex:none;display:flex;align-items:center;min-height:44px;padding:0 8px;position:relative}
.nav .bk{color:var(--tint);font-size:17px;display:flex;align-items:center;gap:2px;padding:8px 6px;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .bk svg{flex:none}
.nav .ttl{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.nav .rt{margin-left:auto;color:var(--tint);font-size:17px;padding:8px}
.large{font-size:34px;font-weight:700;margin:0;padding:2px 18px 10px;letter-spacing:-.01em}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:40px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.search{margin:0 16px 12px;background:#e3e3e8;border-radius:10px;padding:8px 10px;color:var(--sec);font-size:16px;display:flex;gap:6px;align-items:center}
.group{margin:0 16px 22px;background:var(--cell);border-radius:11px;overflow:hidden}
.gtitle{font-size:13px;color:var(--sec);padding:0 32px 6px;text-transform:uppercase}
.cell{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;min-height:44px;position:relative;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell.ind+.cell.ind::before,.cell.ind+.cell::before{left:58px}
.cell .grow{flex:1;min-width:0}
.cell .val{color:var(--sec);font-size:16px}
.chev{color:var(--ter);flex:none}
.sic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none}
.sic svg{width:19px;height:19px}
.toggle{width:51px;height:31px;border-radius:16px;background:#e9e9ea;position:relative;flex:none}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}
.check{color:var(--tint);font-weight:600}
.empty{color:var(--sec);text-align:center;padding:40px 20px;font-size:15px}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:rgba(255,255,255,.97);color:#1c1c1e;padding:10px 16px;border-radius:14px;font-size:14px;z-index:60;max-width:84%;text-align:center;pointer-events:none;transition:opacity .25s;box-shadow:0 8px 30px rgba(60,70,40,.2)}

/* 메시지 */
.trow{display:flex;gap:12px;align-items:center;width:100%;padding:0 0 0 16px;text-align:left;background:var(--cell)}
.trow .tx{flex:1;min-width:0;padding:11px 16px 11px 0;border-bottom:.5px solid var(--sep)}
.trow .tp{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.trow .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.trow .nm .ud{width:9px;height:9px;border-radius:50%;background:#0a84ff;flex:none}
.trow .tm{color:var(--sec);font-size:14px;flex:none;display:flex;align-items:center;gap:4px}
.trow .pv{color:var(--sec);font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;font-weight:600;color:#fff;background:linear-gradient(180deg,#b5b5ba,#8d8d92)}
.av.sm{width:34px;height:34px;font-size:14px}
.av.lg{width:90px;height:90px;font-size:36px}
.av svg{width:60%;height:60%}
.pinned{display:flex;justify-content:center;gap:24px;padding:4px 16px 14px}
.pinned button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sec)}
.pinned .av{width:72px;height:72px;font-size:28px}
.list-white{background:var(--cell)}
.chat-head{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text);padding:0 0 8px;border-bottom:.5px solid var(--sep);background:rgba(249,249,249,.94)}
.chat{padding:8px 14px 18px;display:flex;flex-direction:column}
.chat-bg{background:#fff}
.cday{align-self:center;font-size:11.5px;color:var(--sec);margin:16px 0 6px;font-weight:500;text-align:center}
.cday b{font-weight:600}
.bub{max-width:76%;padding:8px 13px;border-radius:18px;font-size:16px;line-height:1.4;background:var(--them);color:#000;align-self:flex-start;margin-top:5px;word-break:break-word;position:relative}
.bub.me{background:var(--me);color:#fff;align-self:flex-end}
.bub.gap{margin-top:14px}
.bub.link,.bub.loc{padding:0;overflow:hidden;width:240px}
.bub .lk-img{height:110px;background:linear-gradient(135deg,#f3e2c6,#d9a066);display:grid;place-items:center}
.bub .lk-tx{position:relative;padding:9px 12px;background:#e9e9ee;color:#000;line-height:1.35}
.bub .lk-tx small{display:block;color:#6e6e73;font-size:12px}
.sender{font-size:11px;color:var(--sec);margin:8px 0 0 12px}
.read{align-self:flex-end;font-size:11px;color:var(--sec);margin:3px 4px 0}
.compose{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px 30px;background:#fff}
.compose .plus{width:34px;height:34px;border-radius:50%;background:var(--cell2);display:grid;place-items:center;color:var(--sec);font-size:22px;flex:none}
.compose .in{flex:1;border:1px solid var(--sep);border-radius:18px;padding:7px 14px;color:var(--ter);font-size:16px}

/* 전화 */
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);padding:6px 0 28px;border-top:.5px solid var(--sep);background:rgba(249,249,249,.96)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--sec)}
.tabs button.on{color:var(--tint)}
.tabs svg{width:26px;height:26px}
.seg{display:flex;margin:0 16px 10px;background:#e3e3e8;border-radius:9px;padding:2px}
.seg button{flex:1;padding:6px;border-radius:7px;font-size:13px;font-weight:500;text-align:center;color:#000}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.crow{display:flex;align-items:center;gap:10px;width:100%;padding:0 0 0 16px;text-align:left;background:var(--cell)}
.crow .tx{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 0;border-bottom:.5px solid var(--sep)}
.crow .nm{font-size:17px;font-weight:600}
.crow .nm.miss{color:var(--red)}
.crow .kd{font-size:14px;color:var(--sec)}
.crow .tm{margin-left:auto;color:var(--sec);font-size:15px;white-space:nowrap}
.crow .ii{color:var(--tint)}
.idx{font-size:15px;font-weight:600;color:var(--sec);padding:10px 16px 4px;border-bottom:.5px solid var(--sep);background:var(--bg)}
.lrow{display:block;width:100%;text-align:left;padding:10px 16px;border-bottom:.5px solid var(--sep);font-size:17px;background:var(--cell)}
.me-card{display:flex;align-items:center;gap:14px;padding:6px 16px 14px;border-bottom:.5px solid var(--sep)}
.me-card b{font-size:20px;display:block}
.me-card small{color:var(--sec)}
.chead{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px 18px}
.chead h2{margin:4px 0 0;font-size:28px;font-weight:600}
.chead small{color:var(--sec);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 16px 18px}
.acts button{background:var(--cell);border-radius:10px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tint);font-size:11px}
.acts svg{width:22px;height:22px}
.fld{padding:10px 16px}
.fld small{display:block;font-size:14px;color:var(--text)}
.fld span{color:var(--tint);font-size:17px;font-variant-numeric:tabular-nums}
.fld span.plain{color:var(--text)}

/* 캘린더 */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 6px}
.cal-head h2{font-size:28px;margin:0;font-weight:700}
.cal-head h2 span{color:var(--red)}
.cal-head .arr{display:flex;gap:4px}
.cal-head .arr button{color:var(--red);width:36px;height:36px;display:grid;place-items:center}
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--sec);text-align:center;padding:4px 8px;border-bottom:.5px solid var(--sep)}
.mon{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 8px;background:#fff}
.mon button{display:flex;flex-direction:column;align-items:center;height:52px;padding-top:6px;border-top:.5px solid #ececf0;gap:4px}
.mon .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.mon .sun{color:var(--sec)}
.mon .today .n{background:var(--red);color:#fff;font-weight:600}
.mon .sel .n{background:#1c1c1e;color:#fff;font-weight:600}
.mon .today.sel .n{background:var(--red);color:#fff}

`■ 通常逮捕（199条）
・裁判官の発する逮捕状による
・逮捕状の請求　検察官・司法警察員

■ 現行犯逮捕（212・213条）
・現に罪を行い、又は行い終わった者
・何人でも、逮捕状なくして逮捕できる

■ 準現行犯（212条2項）
罪を行い終わってから間がないと明らかに認められ、次のどれかに当たるとき
　① 犯人として追呼されている
　② 贓物や、明らかに犯罪に使ったと思われる凶器などを持っている
　③ 身体・被服に犯罪の顕著な証跡がある
　④ 誰何されて逃走しようとする

■ 緊急逮捕（210条）
・死刑／無期／長期3年以上の懲役・禁錮の罪
・罪を犯したと疑うに足りる「充分な」理由
・急速を要し、逮捕状を求めることができない
・逮捕後「直ちに」逮捕状を請求

班長に聞いたら「条文を読め」って言われた😭`,
`■ 통상체포 (199조)
· 법관이 발부한 체포영장에 의함
· 영장 청구　검찰관·사법경찰원

■ 현행범 체포 (212·213조)
· 지금 죄를 범하고 있거나 막 범한 자
· 누구든지 영장 없이 체포 가능

■ 준현행범 (212조 2항)
범행 직후임이 명백하고 다음 중 하나에 해당할 때
　① 범인으로 쫓기고 있음
　② 장물, 또는 범행에 쓴 것이 분명한 흉기 등을 소지
　③ 몸이나 옷에 범죄의 뚜렷한 흔적이 있음
　④ 불심검문을 받고 도주하려 함

■ 긴급체포 (210조)
· 사형/무기/장기 3년 이상 징역·금고에 해당하는 죄
· 죄를 범했다고 의심할 "충분한" 이유
· 급속을 요해 영장을 청구할 수 없음
· 체포 후 "즉시" 영장 청구

반장님한테 물어봤더니 조문이나 읽으래 😭`]},
 {title:['警部補 刑法 ②違法性阻却','경부보 형법 ② 위법성 조각'], date:'2022-11-06', time:'23:55', body:[
`■ 正当防衛（36条1項）
・急迫不正の侵害に対して
・自己又は他人の権利を防衛するため
・やむを得ずにした行為 → 罰しない

■ 過剰防衛（36条2項）
・防衛の程度を超えた
・情状により 刑を減軽 or 免除できる

■ 緊急避難（37条）
・現在の危難
・ほかに方法がない（補充性）
・生じた害が避けようとした害を超えない（法益の均衡）

正当防衛＝不正 対 正
緊急避難＝正 対 正　← ここ毎回まちがえる！！`,
`■ 정당방위 (36조 1항)
· 급박부정한 침해에 대하여
· 자기 또는 타인의 권리를 방위하기 위해
· 부득이하게 한 행위 → 벌하지 않음

■ 과잉방위 (36조 2항)
· 방위의 정도를 넘음
· 정상에 따라 형을 감경하거나 면제할 수 있음

■ 긴급피난 (37조)
· 현재의 위난
· 다른 방법이 없음 (보충성)
· 생긴 피해가 피하려던 피해를 넘지 않음 (법익 균형)

정당방위 = 부정 대 정
긴급피난 = 정 대 정　← 여기 매번 틀림!!`]},

const captureScroll = () => [...document.querySelectorAll('#view ' + SCROLLERS.split(',').join(',#view '))].map(e => e.scrollTop);

function thumb(v, prog){
  const t = v.th, [bg, fg, ac] = t.c, main = esc(L(t.main)), sub = esc(L(t.sub)), badge = esc(L(t.badge));
  let inner = '';
  if (t.st === 'pastel') inner = `<div class="th pastel" style="--bg:${bg};--fg:${fg};--ac:${ac}"><span class="th-badge">${badge}</span><span class="th-star s1">★</span><span class="th-star s2">✦</span><span class="th-star s3">♥</span><div class="th-txt"><small>${sub}</small><b>${main}</b></div><span class="th-ball"></span></div>`;
  else if (t.st === 'report') inner = `<div class="th report" style="--bg:${bg};--fg:${fg};--ac:${ac}"><span class="th-tag">${badge}</span><div class="th-clock"><i></i></div><div class="th-txt"><b>${main}</b><em>${sub}</em></div><div class="th-line"></div></div>`;
  else if (t.st === 'howto') inner = `<div class="th howto" style="--bg:${bg};--fg:${fg}"><span class="th-badge">${badge}</span><div class="th-bubbles"><i></i><i></i><i></i><i></i></div><div class="th-txt"><b>${main}</b><small>${sub}</small></div></div>`;
  else if (t.st === 'study') inner = `<div class="th study" style="--bg:${bg};--fg:${fg};--ac:${ac}"><span class="th-label">${badge}</span><div class="th-txt"><b>${main}</b><span>${sub}</span></div><span class="th-num">§</span></div>`;
  else if (t.st === 'cook') inner = `<div class="th cook" style="--bg:${bg};--fg:${fg};--ac:${ac}"><div class="th-plate"><i></i></div><div class="th-txt"><span class="th-badge">${badge}</span><b>${main}</b><small>${sub}</small></div></div>`;
  else if (t.st === 'travel') inner = `<div class="th travel" style="--bg:${bg};--fg:${fg};--ac:${ac}"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><path d="M0 120 L70 60 L120 95 L180 40 L250 95 L320 70 V180 H0z" fill="${ac}" opacity=".35"/><path d="M0 145 L110 110 L200 140 L320 115 V180 H0z" fill="${ac}" opacity=".55"/><path d="M220 140c-10-14 10-20 0-36M240 140c-10-14 10-20 0-36M260 140c-10-14 10-20 0-36" stroke="#fff" stroke-width="2.5" fill="none" opacity=".7"/></svg><div class="th-txt"><b>${main}</b><small>${sub}</small></div><span class="th-seal">${badge}</span></div>`;
  else if (t.st === 'lookbook') inner = `<div class="th lookbook" style="--bg:${bg};--fg:${fg};--ac:${ac}"><span class="th-badge">${badge}</span><svg class="th-looks" viewBox="0 0 180 120">${[['#e9d8c4','#5d4a3e',0],['#c96f6f','#2f2f3a',60],['#f3f0ea','#7a8a6a',120]].map(([coat,skirt,x])=>`<g transform="translate(${x} 0)"><rect x="4" y="4" width="52" height="112" rx="10" fill="#fff"/><circle cx="30" cy="22" r="8" fill="#e8c6a8"/><path d="M26 15c2-5 10-5 12 2v6c-1-4-4-6-8-6s-4 1-4-2z" fill="#4a3428"/><path d="M19 32h22l4 34H15z" fill="${coat}"/><path d="M17 66h26l4 22H13z" fill="${skirt}"/><path d="M24 88v20M36 88v20" stroke="#4a3a34" stroke-width="3"/></g>`).join('')}</svg><div class="th-txt"><small>${sub}</small><b>${main}</b></div></div>`;
  else inner = `<div class="th tea" style="--bg:${bg};--fg:${fg};--ac:${ac}"><svg class="th-cup" viewBox="0 0 120 100"><path d="M48 18c-6-8 6-11 0-18M60 18c-6-8 6-11 0-18M72 18c-6-8 6-11 0-18" stroke="${fg}" stroke-width="2" fill="none" opacity=".45"/><path d="M28 30h64l-6 46a10 10 0 0 1-10 9H44a10 10 0 0 1-10-9z" fill="#fff" stroke="${fg}" stroke-width="2"/><ellipse cx="60" cy="34" rx="30" ry="5" fill="${ac}"/><path d="M92 40c14 0 14 22 0 22" stroke="${fg}" stroke-width="3" fill="none"/></svg><div class="th-txt"><b>${main}</b><small>${sub}</small></div><span class="th-badge">${badge}</span></div>`;
  return `<div class="thumb">${inner}<span class="dur">${v.dur}</span>${prog?`<span class="bar" style="width:${prog}%"></span>`:''}</div>`;
}
let vchip = 0;
function videoApp(tab){
  const chips = [['すべて','전체'],['ちいかわ','치이카와'],['勉強','공부'],['暮らし','생활']];
  const list = tab === 'history' ? watched.map(i => [videos[i], i]) : videos.map((v,i) => [v,i]).filter(([v]) => vchip===0 || v.tag===vchip);
  view(`<div class="vtop"><span class="lg"><svg viewBox="0 0 30 22"><rect width="30" height="22" rx="6" fill="#ff3b30"/><path d="M12 6.5v9l7.5-4.5z" fill="#fff"/></svg></span>${L(APPS.video)}</div>

    <div class="scroll vwhite">${list.map(([v,i]) => `<button class="vcard" data-v="${i}">${thumb(v, watched.includes(i) ? progress[i] : 0)}<div class="vmeta"><span class="av">${esc(L(v.ch).slice(0,1))}</span><div><b>${esc(L(v.title))}</b><small>${esc(L(v.ch))} · ${L(['視聴回数','조회수'])} ${esc(L(v.views))} · ${esc(L(v.ago))}</small></div></div></button>`).join('')}</div>
    <div class="tabs" style="grid-template-columns:1fr 1fr"><button class="${tab==='home'?'on':''}" data-vt="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>${L(['ホーム','홈'])}</button><button class="${tab==='history'?'on':''}" data-vt="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>${L(['履歴','기록'])}</button></div>`);

      <div style="display:flex;align-items:flex-end;gap:10px;height:90px;margin-top:12px">${screenT.days.map((d,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span style="width:100%;border-radius:3px;background:#0a84ff;height:${d[1]/max*70}px"></span><span style="font-size:10px;color:var(--sec)">${WD[lang][i]}</span></div>`).join('')}</div></div>

    <div class="group">${screenT.apps.map(a=>`<div class="cell ind"><span class="ic" style="width:30px;height:30px;border-radius:7px;overflow:hidden;display:block;flex:none">${icon(a[0])}</span><span class="grow">${esc(L(APPS[a[0]]))}<span style="display:block;height:4px;border-radius:2px;background:#0a84ff;margin-top:5px;width:${a[1]/screenT.apps[0][1]*100}%"></span></span><span class="val">${a[1]}${L(['分','분'])}</span></div>`).join('')}</div>
    <div class="gtitle">${L(['持ち上げ','픽업'])}</div>
    <div class="group"><div class="cell"><span class="grow">${L(['1日の平均','일일 평균'])}</span><span class="val">${L(['96回','96회'])}</span></div><div class="cell"><span class="grow">${L(['持ち上げ後に最初に使用','픽업 후 처음 사용한 앱'])}</span><span class="val">${L(APPS.msg)}</span></div></div>
    <div class="gtitle">${L(['通知','알림'])}</div>
    <div class="group">${screenT.notif.map(n=>`<div class="cell"><span class="grow">${esc(n[0])}</span><span class="val">${L(['1日平均 ','일평균 '])}${n[1]}${L(['件','건'])}</span></div>`).join('')}</div>
  </div>`);
}

/* ================= 음악 ================= */
function musicApp(){
  view(`${nav(null)}<h1 class="large">${L(['今すぐ聴く','지금 듣기'])}</h1><div class="scroll">
    <h2 style="font-size:22px;padding:0 16px 10px;margin:0">${L(['最近再生したプレイリスト','최근 재생한 플레이리스트'])}</h2>
    <div class="mgrid">${music.recent.map((p,i)=>`<button data-pl="${i}"><div class="art" style="background:linear-gradient(135deg,${p.c[0]},${p.c[1]})">${esc(L(p.n))}</div>${esc(L(p.n))}<small style="display:block;color:var(--sec)">${L(['ももえ','모모에'])}</small></button>`).join('')}</div>
    <h2 style="font-size:22px;padding:0 16px 10px;margin:0">${L(['最近再生した曲','최근 재생한 노래'])}</h2>
    <div class="group">${music.songs.map(s=>`<div class="cell"><span class="sic" style="background:linear-gradient(135deg,#ffd1dc,#cfe0a8)"></span><span class="grow">${esc(lang==='ko'?s[1]:s[0])}<small style="display:block;color:var(--sec);font-size:13px">${esc(s[2])}</small></span></div>`).join('')}</div></div>
    <div class="mini"><span class="art" style="background:linear-gradient(135deg,#ffd1dc,#ffb36b)"></span><span>${esc(L(['カモミール','캐모마일']))}</span><span style="flex:none">⏸</span></div>`);
  $$('#view [data-pl]').forEach(b => b.onclick = () => push(() => { const p = music.recent[+b.dataset.pl];
    view(`${nav(L(['今すぐ聴く','지금 듣기']))}<div class="scroll" style="text-align:center;padding:10px 40px 40px"><div style="aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,${p.c[0]},${p.c[1]});box-shadow:0 10px 30px rgba(0,0,0,.15)"></div><h2 style="margin:16px 0 4px;font-size:22px">${esc(L(p.n))}</h2><div style="color:var(--sec);font-size:14px">${L(['ももえ','모모에'])}</div><div style="display:flex;gap:12px;margin-top:18px"><span style="flex:1;background:var(--cell);border-radius:10px;padding:12px;color:var(--red);font-weight:600">▶ ${L(['再生','재생'])}</span><span style="flex:1;background:var(--cell);border-radius:10px;padding:12px;color:var(--red);font-weight:600">⤨ ${L(['シャッフル','셔플'])}</span></div></div>`); }));
}

function remindersApp(){
  const open = reminders.filter(r => !r[0]), done = reminders.filter(r => r[0]);
  const row = r => `<div class="cell rm${r[0]?' done':''}"><span class="rm-c"></span><span class="grow">${esc(L(r[1]))}${L(r[2])?`<small>${esc(L(r[2]))}</small>`:''}</span></div>`;
  view(`${nav(L(['リスト','목록']),'',L(['編集','편집']))}<h1 class="large" style="color:#f2a33a">${L(['リマインダー','미리 알림'])}</h1><div class="scroll">
    <div class="group">${open.map(row).join('')}</div>
    <div class="gtitle">${L(['実行済み','완료됨'])}</div><div class="group">${done.map(row).join('')}</div></div>`);
  $$('#view .rm').forEach(c => c.onclick = () => c.classList.toggle('done'));
}

renderStatic();
show('lock');
